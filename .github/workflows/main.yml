name: 🕉️ Build Hindu Dharma AI — APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 🏗️ Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🗂️ Create Clean Android Project from scratch
        run: |
          # ── Clean workspace — remove any existing conflicting files ──
          rm -f build.gradle settings.gradle gradlew gradlew.bat
          rm -rf .gradle gradle app

          # ── Download Gradle 8.4 ──
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip \
               -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          GRADLE="/tmp/gradle-8.4/bin/gradle"
          chmod +x "$GRADLE"
          echo "✅ Gradle 8.4 ready"

          # ── Root build.gradle ──
          cat > build.gradle << 'ROOTGRADLE'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
ROOTGRADLE

          # ── settings.gradle ──
          cat > settings.gradle << 'SETTINGS'
rootProject.name = "HinduDharmaAI"
include ':app'
SETTINGS

          # ── Generate gradlew via wrapper task ──
          "$GRADLE" wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          echo "✅ gradlew generated"

          # ── app/build.gradle ──
          mkdir -p app
          cat > app/build.gradle << 'APPGRADLE'
apply plugin: 'com.android.application'

android {
    namespace 'com.hindudharma.ai'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.hindudharma.ai"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
APPGRADLE

          # ── AndroidManifest.xml ──
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    <application
        android:allowBackup="true"
        android:label="হিন্দু ধর্ম AI"
        android:theme="@style/Theme.AppCompat.NoActionBar"
        android:hardwareAccelerated="true"
        android:usesCleartextTraffic="true">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="portrait"
            android:windowSoftInputMode="adjustResize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
MANIFEST

          # ── MainActivity.java ──
          mkdir -p app/src/main/java/com/hindudharma/ai
          cat > app/src/main/java/com/hindudharma/ai/MainActivity.java << 'JAVA'
package com.hindudharma.ai;
import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebChromeClient;
import android.view.Window;
public class MainActivity extends Activity {
    private WebView webView;
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        requestWindowFeature(Window.FEATURE_NO_TITLE);
        webView = new WebView(this);
        setContentView(webView);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setAllowFileAccess(true);
        s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());
        webView.loadUrl("file:///android_asset/index.html");
    }
    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
JAVA

          # ── res/values ──
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'STRINGS'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">হিন্দু ধর্ম AI</string>
</resources>
STRINGS

          cat > app/src/main/res/values/styles.xml << 'STYLES'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
        <item name="colorPrimary">#8B1A1A</item>
        <item name="colorPrimaryDark">#2D0F00</item>
        <item name="colorAccent">#D4A017</item>
    </style>
</resources>
STYLES

          # ── assets/index.html (from repo if exists, else default) ──
          mkdir -p app/src/main/assets
          HTML_SRC=$(find . -name "index.html" -not -path "*/assets/*" | head -1)
          if [ -n "$HTML_SRC" ]; then
            cp "$HTML_SRC" app/src/main/assets/index.html
            echo "✅ index.html copied from: $HTML_SRC"
          else
            cat > app/src/main/assets/index.html << 'HTML'
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হিন্দু ধর্ম AI</title>
<style>
  body{font-family:sans-serif;background:#FFF8E7;text-align:center;padding:40px 20px;margin:0}
  h1{color:#8B1A1A;font-size:28px}
  p{color:#5C2E00;font-size:16px;margin-top:20px}
</style>
</head>
<body>
<h1>ॐ হিন্দু ধর্ম AI</h1>
<p>ঈশ্বরের আলোয় জ্ঞানের সন্ধান</p>
</body>
</html>
HTML
            echo "✅ Default index.html created"
          fi

          # ── proguard ──
          touch app/proguard-rules.pro

          echo ""
          echo "✅ Full Android project ready!"
          find . -not -path "./.git/*" -not -path "./node_modules/*" -type f | sort

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Build complete!"
          find . -name "*.apk" -type f

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HinduDharmaAI-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Success
        run: |
          APK=$(find . -name "app-debug.apk" | head -1)
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "=============================="
          echo "✅ APK Build সফল!"
          echo "📦 Size: $SIZE"
          echo "🔢 Build: #${{ github.run_number }}"
          echo "=============================="

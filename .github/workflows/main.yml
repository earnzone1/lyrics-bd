name: Build VedaNova AI APK (Testing)

# ============================================================================
#  VedaNova AI — Debug APK Build Workflow
#  উদ্দেশ্য: প্রতিবার কোড push/PR হলে অথবা ম্যানুয়ালি চালালে একটি টেস্টযোগ্য
#  Debug APK বানিয়ে GitHub Actions Artifacts থেকে ডাউনলোড করার ব্যবস্থা করা।
# ============================================================================

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}   # চাইলে GitHub Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" করা যাবে

# একই ব্রাঞ্চে নতুন push এলে পুরনো চলমান বিল্ড বাতিল হয়ে যাবে (সময় বাঁচাতে)
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1) রিপোজিটরির কোড checkout করা
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) JDK 17 সেটআপ করা (AGP 9.x / Gradle 9.x এর জন্য প্রয়োজন)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 3) Android SDK সেটআপ করা (compileSdk 36 পর্যন্ত সাপোর্ট)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4) গোপন Gemini API Key দিয়ে .env ফাইল বানানো
      #    GitHub Repo -> Settings -> Secrets and variables -> Actions
      #    এ গিয়ে GEMINI_API_KEY নামে একটি secret যোগ করে নিন।
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          cat .env.example >> /dev/null || true

      # 5) ডিবাগ কিস্টোর তৈরি করা (রিপোতে debug.keystore গিটইগনোর করা থাকে,
      #    তাই CI-তে প্রতিবার স্ট্যান্ডার্ড Android ডিবাগ কি জেনারেট করা হচ্ছে)
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6) Gradle Wrapper জেনারেট করা (রিপোতে gradlew স্ক্রিপ্ট নেই বলে ধরে নেওয়া হচ্ছে;
      #    ইতিমধ্যে gradlew থাকলে এই স্টেপ নিজে থেকেই স্কিপের মতো কাজ করবে)
      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      # 7) Gradle ক্যাশ ও বিল্ড স্পিড-আপ
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8) Debug APK বিল্ড করা (টেস্টিং এর জন্য release লাগবে না)
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 9) তৈরি হওয়া APK খুঁজে বের করা ও Artifact হিসেবে আপলোড করা
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vedanova-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 10) (ঐচ্ছিক) ইউনিট টেস্ট রিপোর্ট আপলোড, ফেইল হলেও বিল্ড লগ দেখতে সুবিধা হবে
      - name: Upload test reports (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
          

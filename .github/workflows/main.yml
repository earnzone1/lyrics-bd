name: 🕉️ Build Hindu Dharma AI — APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: 🏗️ Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Extract ZIP if exists
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "✅ ZIP found: $ZIP"
            unzip -o "$ZIP" -d _extracted
            INNER=$(find _extracted -name "build.gradle" | head -1 | xargs dirname 2>/dev/null)
            if [ -n "$INNER" ]; then
              cp -rn "$INNER"/. .
              echo "✅ Files copied from: $INNER"
            fi
          fi
          echo "📁 Files:" && ls -la

      - name: 🔧 Setup Gradle with wrapper plugin
        run: |
          # Install specific gradle version
          GRADLE_VERSION="8.4"
          GRADLE_ZIP="gradle-${GRADLE_VERSION}-bin.zip"
          GRADLE_URL="https://services.gradle.org/distributions/${GRADLE_ZIP}"

          echo "⬇️ Downloading Gradle ${GRADLE_VERSION}..."
          wget -q "$GRADLE_URL" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          export GRADLE_BIN="/tmp/gradle-${GRADLE_VERSION}/bin/gradle"
          chmod +x "$GRADLE_BIN"
          echo "✅ Gradle downloaded"

          # Generate proper gradlew using gradle wrapper task
          "$GRADLE_BIN" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin
          chmod +x gradlew
          echo "✅ gradlew generated by Gradle itself"
          ls -la gradlew gradle/wrapper/

      - name: 🔧 Fix app/build.gradle
        run: |
          cat > app/build.gradle << 'APPGRADLE'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.hindudharma.ai'
              compileSdkVersion 34

              defaultConfig {
                  applicationId "com.hindudharma.ai"
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APPGRADLE
          echo "✅ app/build.gradle fixed"

      - name: 🔧 Fix root build.gradle
        run: |
          cat > build.gradle << 'ROOTGRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          ROOTGRADLE
          echo "✅ root build.gradle fixed"

      - name: 🔧 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "✅ Build done!"
          find . -name "*.apk"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HinduDharmaAI-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 🎉 Done
        run: |
          APK_PATH=$(find . -name "app-debug.apk" | head -1)
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "=================================="
          echo "✅  APK Build সফল হয়েছে!"
          echo "📦  Size: $APK_SIZE"
          echo "🔢  Build: #${{ github.run_number }}"
          echo "=================================="

name: 🕉️ Build Hindu Dharma AI — APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: ✅ Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📋 Check project files
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Checking gradlew ==="
          find . -name "gradlew" -type f 2>/dev/null || echo "gradlew NOT FOUND"
          find . -name "build.gradle" -type f 2>/dev/null || echo "build.gradle NOT FOUND"

      - name: 🔑 Grant Gradle execute permission
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ gradlew not found! Android project files missing."
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "✅ Found gradlew at: $GRADLEW_PATH"

      - name: 🔧 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗️ Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          PROJ_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJ_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HinduDharmaAI-debug-${{ github.run_number }}
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
